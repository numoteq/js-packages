name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

# The automatic token cannot open pull requests in a private repository
# (forgejo/forgejo#13739), so the version PR is opened with a short-lived JWT
# for the `bot` user's Authorized Integration "js-packages release".
enable-openid-connect: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.17.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: jwt
        env:
          AUDIENCE: u:7:892a034e-a431-4667-9554-dd8a7e088e05
        run: |
          jwt=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | node -p 'JSON.parse(require("fs").readFileSync(0)).value')
          echo "::add-mask::$jwt"
          echo "token=$jwt" >> "$GITHUB_OUTPUT"
      - id: changesets
        uses: https://github.com/openscript/changesets-action@1967829df87d04313e295397cc26365b1c2c1eba # v2.1.2, Forgejo-compatible fork
        with:
          github-token: ${{ steps.jwt.outputs.token }}
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ steps.jwt.outputs.token }}
      # npm publishing runs in the GitHub mirror (.github/workflows/release.yml).
      - id: releases
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/tag-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload EmDash registry bundles
        if: steps.releases.outputs.published == 'true'
        run: node scripts/upload-emdash-bundles.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.releases.outputs.published-packages }}
